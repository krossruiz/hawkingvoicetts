{% set name = "hawkingvoicetts" %}
{% set version = "0.1.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"
  entry_points:
    - hawkingvoicetts = hawkingvoicetts.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - requests >=2.31
    - questionary >=2.0
    - pip
    # piper-tts isn't published on conda-forge as of writing; the post-link
    # `pip install .` step above pulls it in from PyPI as a project dependency.

test:
  imports:
    - hawkingvoicetts
  commands:
    - hawkingvoicetts --help

about:
  home: https://github.com/kross/hawkingvoicetts
  summary: "Chat with a local Ollama model and hear its replies spoken aloud, robotic or realistic."
  license: NONE
  license_file: ""

extra:
  recipe-maintainers:
    - kross
